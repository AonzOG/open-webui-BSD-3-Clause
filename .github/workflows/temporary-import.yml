name: Temporary verified Open WebUI BSD import
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-import.yml']

permissions:
  contents: write

jobs:
  import-snapshot:
    if: github.repository == 'AonzOG/open-webui-BSD-3-Clause'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out isolated candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: import-open-webui-bsd3-retry-3e7bce-20261011
          fetch-depth: 1
          persist-credentials: true
      - name: Import exact source blobs without modifying workflow files
        shell: bash
        env:
          SOURCE_COMMIT: 3e7bce092129c5a9c98f268b3af0fca6971a40d3
          SOURCE_TREE: 7b966b947ca7dab6dc547e4d19196b11007e424d
          CANDIDATE: import-open-webui-bsd3-retry-3e7bce-20261011
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/open-webui/open-webui.git
          git fetch --no-tags --depth=1 upstream "$SOURCE_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$SOURCE_TREE"
          git read-tree "$SOURCE_TREE"
          # Keep the candidate's existing workflow unchanged. The connected
          # GitHub app will restore upstream workflow contents in one commit.
          git reset -q HEAD -- .github/workflows
          if ! git diff --cached --quiet -- .github/workflows; then
            echo 'Workflow changes must not enter this token-restricted push' >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'Source import unexpectedly empty' >&2
            exit 1
          fi
          git commit --quiet -m "Import pinned BSD-3-Clause source, workflows pending"
          test "$(git show HEAD:LICENSE | head -n 1)" = 'Copyright (c) 2023-2025 Timothy Jaeryang Baek'
          git push origin "HEAD:refs/heads/$CANDIDATE"
          echo "Pinned source files published to candidate. Workflows pending."
